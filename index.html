<!-- In-Page Push với bộ định vị góc dưới tự động -->
    <script>
      (function(s){
        s.dataset.zone = '11730411';
        s.src = 'https://nap5k.com/tag.min.js';
      })([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')));

      // Can thiệp ép khung quảng cáo nhảy xuống đáy
      const fixAdPosition = () => {
        const adElements = document.querySelectorAll('body > div, body > aside');
        adElements.forEach(el => {
          if (el.style.top && (el.style.position === 'fixed' || el.style.position === 'absolute') && el.id !== 'root') {
            el.style.setProperty('top', 'auto', 'important');
            el.style.setProperty('bottom', '16px', 'important');
            el.style.setProperty('right', '16px', 'important');
          }
        });
      };
      const observer = new MutationObserver(fixAdPosition);
      observer.observe(document.body, { childList: true, subtree: true });
      setInterval(fixAdPosition, 1000);
    </script>
  </body>
</html>
